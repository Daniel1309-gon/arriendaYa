services:                                                                                                                                   
  postgres:                                                                                                                                 
    image: postgres:16                                                                                                                      
    ports:                                                                                                                                  
      - "5433:5432"                                                                                                                         
    environment:                                                                                                                            
      POSTGRES_USER: arriendaya                                                                                                             
      POSTGRES_PASSWORD: secretpassword                                                                                                     
      POSTGRES_DB: arriendaya_db                                                                                                            
    volumes:                                                                                                                                
      - pgdata:/var/lib/postgresql/data                                                                                                     
                                                                                                                                            
  mongo:                                                                                                                                    
    image: mongo:7                                                                                                                          
    ports:                                                                                                                                  
      - "27017:27017"                                                                                                                       
    volumes:                                                                                                                                
      - mongodata:/data/db                                                                                                                  
                                                                                                                                            
  redis:                                                                                                                                    
    image: redis:7                                                                                                                          
    ports:                                                                                                                                  
      - "6379:6379"                                                                                                                         
    volumes:                                                                                                                                
      - redisdata:/data                                                                                                                     
                                                                                                                                            
volumes:                                                                                                                                    
  pgdata:                                                                                                                                   
  mongodata:                                                                                                                                
  redisdata: